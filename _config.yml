# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Ferdinand Mütsch
description: Hi and welcome! 👋 I'm Ferdinand, a passionate software- and data engineer and technology enthusiast from Karlsruhe, Germany. I blog about personal projects, software development and systems administration, some machine learning and technology in general. All content you will find here is [human-written](/statement-about-generative-ai.html). Enjoy and feel free to say hi if you wish!
author: Ferdinand Mütsch
language: english
timezone:	Europe/Berlin
pgp:
  fingerprint: 8026 43D5 EC1F 292A 69D2 8699 21B2 4C0F 6C75 F6CF
  file: ferdinand_muetsch.asc
# iota: iota1qprryy5j4zd7ykfksenx97lzg0rurzy9dkwjq3fk8hmfxtc37nltkhgwrjc

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://muetsch.io
root: /
permalink: :title.html
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: html/**/*
include:
  - ".well-known/**"

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link: true # Open external links in new tab
filename_case: 1
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace:

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 15
pagination_dir: page

# Math
math:
  katex:
    css: /vendor/katex.min.css
  mathjax:
    css: /vendor/math.css

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: cactus-dark

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  - type: rsync
    host: muetsch.io
    user: ferdinand
    root: /var/www/muetsch.io
    verbose: false
    progress: false
    delete: true
    args: "-z"

sitemap:
  path: sitemap.xml

feed:
  enable: true
  type: rss2
  path: rss2.xml
  limit: 5
  content:
  order_by: -date
  autodiscovery: true
  template:
